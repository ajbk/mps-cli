<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPS - Pilates Class Plan Studio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div>
                <div class="brand-row">
                    <span class="brand-mark">MPS</span>
                    <span class="status-pill">Deterministic engine</span>
                </div>
                <p class="subtitle">Pilates class plan studio for Total Body programming.</p>
            </div>
            <div class="top-actions">
                <button class="ghost-button" id="copy-markdown" type="button">Copy Markdown</button>
                <button class="ghost-button" id="download-json" type="button">Download JSON</button>
            </div>
        </header>

        <div class="workspace">
            <aside class="control-panel" aria-label="Class request controls">
                <section class="panel-section">
                    <div class="section-heading">
                        <h2>Request</h2>
                        <button class="text-button" id="reset-request" type="button">Reset</button>
                    </div>

                    <label class="field">
                        <span>Movement experience</span>
                        <select id="experience">
                            <option value="ShoulderFreedom">Shoulder Freedom</option>
                            <option value="HappyHips">Happy Hips</option>
                            <option value="SpineReset">Spine Reset</option>
                        </select>
                    </label>

                    <div class="preset-grid" aria-label="Quick presets">
                        <button class="preset-button active" type="button" data-preset="ShoulderFreedom">Shoulder</button>
                        <button class="preset-button" type="button" data-preset="HappyHips">Hips</button>
                        <button class="preset-button" type="button" data-preset="SpineReset">Spine</button>
                    </div>

                    <div class="two-column">
                        <label class="field">
                            <span>Duration</span>
                            <select id="duration">
                                <option value="45">45 min</option>
                                <option value="60" selected>60 min</option>
                                <option value="75">75 min</option>
                            </select>
                        </label>

                        <label class="field">
                            <span>Students</span>
                            <input id="students" type="number" value="4" min="1" max="32">
                        </label>
                    </div>

                    <label class="field">
                        <span>Level</span>
                        <select id="level">
                            <option value="Beginner">Beginner</option>
                            <option value="BeginnerIntermediate" selected>Beginner Intermediate</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="IntermediateAdvanced">Intermediate Advanced</option>
                            <option value="Advanced">Advanced</option>
                        </select>
                    </label>
                </section>

                <section class="panel-section">
                    <h2>Equipment</h2>
                    <div class="toggle-row" id="equipment">
                        <label class="toggle-chip active">
                            <input type="checkbox" value="Reformer" checked>
                            <span>Reformer</span>
                        </label>
                        <label class="toggle-chip active">
                            <input type="checkbox" value="Chair" checked>
                            <span>Chair</span>
                        </label>
                    </div>
                    <p class="hint">Mat and Standing are used automatically for assessment, transfer, and retest phases.</p>
                </section>

                <section class="panel-section">
                    <h2>Safety</h2>
                    <label class="field">
                        <span>Risk policy</span>
                        <select id="risk-policy">
                            <option value="Conservative" selected>Conservative</option>
                            <option value="Balanced">Balanced</option>
                        </select>
                    </label>

                    <div class="toggle-row compact" id="contraindications">
                        <label class="toggle-chip"><input type="checkbox" value="wrist_pain"><span>Wrist pain</span></label>
                        <label class="toggle-chip"><input type="checkbox" value="knee_pain"><span>Knee pain</span></label>
                        <label class="toggle-chip"><input type="checkbox" value="low_back_pain"><span>Low back</span></label>
                        <label class="toggle-chip"><input type="checkbox" value="high_blood_pressure"><span>High BP</span></label>
                    </div>

                    <label class="field">
                        <span>Other contraindications</span>
                        <input id="contra-extra" type="text" placeholder="acute_low_back_pain, ankle_instability">
                    </label>
                </section>

                <section class="panel-section">
                    <h2>Observations</h2>
                    <textarea id="observations" rows="5">thoracic stiffness, limited overhead reach, desk workers</textarea>
                    <button class="primary-button" id="generate-plan" type="button">Generate Plan</button>
                    <p class="error-message" id="error-message" role="alert"></p>
                </section>
            </aside>

            <main class="plan-panel" aria-live="polite">
                <nav class="view-tabs" aria-label="Plan views">
                    <button class="tab-button active" type="button" data-view="plan">Plan</button>
                    <button class="tab-button" type="button" data-view="markdown">Markdown</button>
                    <button class="tab-button" type="button" data-view="json">JSON</button>
                </nav>

                <section class="summary-band" id="summary-band"></section>
                <section class="strategy-band" id="strategy-band"></section>
                <section class="content-view" id="content-view"></section>
            </main>
        </div>
    </div>

    <script src="seed-data.js"></script>
    <script src="mps-engine.js"></script>
    <script src="app.js"></script>
</body>
</html>
